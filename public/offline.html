<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · FINANCE_OS</title>
<style>
  :root { --bg: #0b0f12; --fg: #d8e4ea; --muted: #8fa3ad; --accent: #4fd1c5; --line: #22303a; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f4; --fg: #14202a; --muted: #4a5a66; --accent: #0f6b63; --line: #cfd8dc; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  section { max-width: 26rem; border: 1px solid var(--line); padding: 24px; }
  img { width: 40px; height: 40px; }
  h1 { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin: 16px 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  button { font: inherit; letter-spacing: .12em; text-transform: uppercase; font-size: 12px;
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
    padding: 8px 14px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <section>
    <img src="/icons/bluefalls-mark.svg" alt="">
    <h1>You're offline</h1>
    <p>FINANCE_OS needs a connection to show your budget. Your financial data is never stored on this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </section>
</main>
</body>
</html>
